name: "PennySage (Backend)"

services:
  api_server:
    build:
      context: .
      target: final
      args:
        DATABASE_DIR: ${DATABASE_DIR}
        DATABASE_FILE: ${DATABASE_FILE}
        DATABASE_URL: ${DATABASE_URL}
    image: pennysage_backend
    ports:
      - 3000:3000
    volumes:
      - db-data:${DATABASE_DIR}
    env_file:
      - path: ../.env
        required: true
    environment:
      - RUNTIME=docker
volumes:
  db-data:
