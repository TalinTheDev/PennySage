[package]
name = "pennysage-backend-lib"
version = "0.1.0"
edition = "2021"

[dependencies]
sqlx = { version = "0.7", features = ["sqlite", "macros"] }
chrono = { version = "0.4.38", features = ["alloc"] }
derive_more = { version = "2.0.1", features = ["from"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
jsonwebtoken = { version = "9", default-features = false }
nanoid = "0.4.0"
argon2 = "0.5.3"
axum = { version = "0.7.5", features = ["macros", "json", "multipart"] }
axum-extra = { version = "0.9.3", features = ["cookie", "typed-header"] }
